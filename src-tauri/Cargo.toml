[package]
name = "lark"
version = "0.1.0"
description = "A Tauri App"
authors = ["dmj"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "devtools", "tray-icon", "unstable", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
window-shadows = "0.2.1"
image = "0.25.5"
pelite = "0.10.0"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
auto-launch = "0.6.0"
pinyin = "0.11.0"
icns = "0.4.0"
tauri-icns = "0.1.0"
applications = "0.3.1"
base64 = "0.23.1"
plist = "1.6.1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
webbrowser = "1.0.1"
enigo = "0.6.1"
open = "5"
winit = "0.30.3"
anyhow = "1.0.104"
rusqlite = "0.40.2"
rust-crypto = "0.2.36"
chrono = "0.4.45"
arboard = "3.4.0"
rdev = { version = "0.5.1", features = ['unstable_grab'] } #获取键盘按键
#accessibility = "0.1.6" #获取鼠标选中文本
libc = "0.2.152"
rayon = "1.12.0"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27.0"
core-graphics = "0.25.0"
objc = "0.2.7"


[target.'cfg(windows)'.dependencies]
#windows = { version = "0.58.0", features = [
#    "Win32_System_Com",
#    "Win32_System_WindowsProgramming",
#    "Win32_UI_Shell_Common",
#    "Win32_UI_Shell",
#    "Win32_System_Com_StructuredStorage",
#    "Win32_System_Variant",
#    "Win32",
#    "Win32_Storage_FileSystem",
#    "Win32_Foundation",
#    "Win32_UI_Shell_PropertiesSystem",
#    "Win32_UI_WindowsAndMessaging",
#    "Win32_System_Ole",
#    "Win32_Graphics_Gdi",
#    "Win32_System_Memory",
#    "Win32_System_LibraryLoader",
#    "Win32_System",
#] }
windows = { version = "0.58.0", features = [
    "Win32",
    "Win32_Graphics",
    "Win32_Graphics_Gdi",
    "Win32_System",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
] }
winapi = { version = "0.3.9", features = ["winuser", "shellapi", 'winnt', 'psapi', 'windef', 'combaseapi', 'tlhelp32', 'processenv', 'wingdi'] }
dunce = "1.0.5"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
clipboard-win = "5.4.0"
kernel32-sys = "0.2.2"
lnk = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
